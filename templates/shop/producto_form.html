{% extends "shop/base.html" %}

{% block title %}{% if producto %}Editar{% else %}Nuevo{% endif %} producto{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card border-0 shadow-sm p-4">
            <h2 class="fw-black text-uppercase">{% if producto %}Editar producto{% else %}Nuevo producto{% endif %}</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre</label>
                    <input name="nombre" class="form-control" value="{{ producto.nombre|default:'' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Categoria</label>
                    <select name="id_categoria" class="form-select">
                        <option value="">General</option>
                        {% for cat in categorias %}
                            <option value="{{ cat.id_categoria }}" {% if producto and producto.categoria_id == cat.id_categoria %}selected{% endif %}>{{ cat.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Descripcion</label>
                    <textarea name="descripcion" class="form-control" rows="4">{{ producto.descripcion|default:'' }}</textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Precio</label>
                        <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto.precio|default:'0.00' }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Stock</label>
                        <input type="number" name="stock" class="form-control" value="{{ producto.stock|default:'1' }}" min="0" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">URL de imagen</label>
                    <input type="url" name="imagen_url" class="form-control" value="{{ producto.imagen_url|default:'' }}">
                </div>
                <button class="btn btn-primary">Guardar</button>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
